name: 功能有问题
description: 标注没出现、拉黑失败、页面错乱等
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        X 改版会让这类工具失效 —— 如果昨天还好好的今天突然不标注了，
        多半是 X 动了页面结构。请附上下面的信息，修起来快很多。
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      placeholder: 期望……实际……
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 扩展版本
      description: 弹窗底部或 chrome://extensions 里
      placeholder: "0.7.5"
    validations:
      required: true
  - type: dropdown
    id: page
    attributes:
      label: 在哪个页面
      options: [主页时间线, 搜索页, 某条推文的回复区, 个人主页, 通知页, 其它]
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: 控制台报错（可选）
      description: F12 → Console，把红色报错贴进来
